<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OCSB XML Viewer</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        #logo {
            height: 100px;
            margin-right: 10px;
        }

        h1 {
            margin: 0;
            text-align: center;
            flex-grow: 1;
        }

        #fileInput,
        #readButton {
            margin: 10px;
        }

        #fileInput {
            display: inline-block;
            vertical-align: middle;
        }

        #readButton {
            display: inline-block;
            vertical-align: middle;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: 2px solid #4CAF50;
            cursor: pointer;
        }

        #line {
            width: 80%;
            height: 2px;
            background-color: #ccc;
            margin: 20px;
        }
    </style>

    <!-- JavaScript XSLT processor (replaces the browser's built-in XSLT) -->
    <script src="https://cdn.jsdelivr.net/npm/@tradik/xslt-processor@1/dist/xslt-processor.browser.min.js"></script>

    <script>
        // Decode raw bytes: try UTF-8 first, then fall back to the encoding
        // declared in the XML header (OnSIS files use ISO-8859-1).
        function decodeBuffer(buffer) {
            try {
                return new TextDecoder("utf-8", { fatal: true }).decode(buffer);
            } catch (e) {
                var head = new TextDecoder("windows-1252").decode(buffer.slice(0, 200));
                var m = head.match(/encoding\s*=\s*["']([^"']+)["']/i);
                try {
                    return new TextDecoder(m ? m[1] : "windows-1252").decode(buffer);
                } catch (e2) {
                    return new TextDecoder("windows-1252").decode(buffer);
                }
            }
        }

        async function readXMLFile() {
            var input = document.getElementById('fileInput');
            var file = input.files[0];

            if (!file) {
                alert('Please select an XML file.');
                return;
            }

            try {
                // Read the XML file
                var xmlContent = decodeBuffer(await file.arrayBuffer());

                var parser = new DOMParser();
                var xmlDocument = parser.parseFromString(xmlContent, 'application/xml');

                var xmlError = xmlDocument.getElementsByTagName('parsererror');
                if (xmlError.length > 0) {
                    throw new Error('The XML file could not be parsed.\n\n' + xmlError[0].textContent);
                }

                // Load the XSL file
                var response = await fetch('style_format.xsl');
                if (!response.ok) {
                    throw new Error('Could not load style_format.xsl. HTTP status: ' + response.status);
                }

                var xslContent = decodeBuffer(await response.arrayBuffer());
                var xslDocument = parser.parseFromString(xslContent, 'application/xml');

                var xslError = xslDocument.getElementsByTagName('parsererror');
                if (xslError.length > 0) {
                    throw new Error('style_format.xsl could not be parsed.\n\n' + xslError[0].textContent);
                }

                // Transform using the JavaScript XSLT library
                if (typeof XsltProcessorLib === 'undefined' || !XsltProcessorLib.XSLTProcessor) {
                    throw new Error('The JavaScript XSLT processor library was not loaded.');
                }

                var xsltProcessor = new XsltProcessorLib.XSLTProcessor();
                xsltProcessor.importStylesheet(xslDocument);

                var transformedContent = xsltProcessor.transformToDocument(xmlDocument);

                // Display the result
                var body = transformedContent.getElementsByTagName('BODY')[0] ||
                           transformedContent.getElementsByTagName('body')[0];

                if (body) {
                    document.getElementById('result').innerHTML = body.innerHTML;
                } else {
                    document.getElementById('result').innerHTML =
                        new XMLSerializer().serializeToString(transformedContent);
                }

            } catch (error) {
                console.error('PROCESSING ERROR:', error);
                alert('Processing failed.\n\n' + error.message);
            }
        }
    </script>
</head>
<body>
    <header>
        <img id="logo" src="logo.jpg" alt="Logo">
        <h1>View ONSIS XML Error File</h1>
    </header>
    <div>
        <input type="file" id="fileInput">
        <button id="readButton" onclick="readXMLFile()">View XML File</button>
    </div>
    <div id="line"></div>
    <div id="result"></div>
</body>
</html>
