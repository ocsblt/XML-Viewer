<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OCSB XML Viewer</title>

    <!-- XSLT 1.0 JavaScript processor/polyfill -->
    <script src="https://cdn.jsdelivr.net/npm/@tradik/xslt-processor@1/dist/xslt-processor.browser.min.js"></script>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        #logo {
            height: 100px;
            margin-right: 10px;
        }

        h1 {
            margin: 0;
            text-align: center;
            flex-grow: 1;
        }

        #fileInput,
        #readButton {
            margin: 10px;
        }

        #fileInput {
            display: inline-block;
            vertical-align: middle;
        }

        #readButton {
            display: inline-block;
            vertical-align: middle;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: 2px solid #4CAF50;
            cursor: pointer;
        }

        #line {
            width: 80%;
            height: 2px;
            background-color: #ccc;
            margin: 20px;
        }
    </style>
</head>

<body>

    <header>
        <img id="logo" src="logo.jpg" alt="Logo">
        <h1>View ONSIS XML Error File</h1>
    </header>

    <div>
        <input type="file" id="fileInput">
        <button id="readButton">View XML File</button>
    </div>

    <div id="line"></div>

    <div id="result"></div>

    <script>
        async function readXMLFile() {

            var input = document.getElementById('fileInput');
            var file = input.files[0];

            if (!file) {
                alert('Please select an XML file.');
                return;
            }

            try {

                // Read the selected XML file
                var xmlContent = await file.text();

                // Load the XSLT file
                var response = await fetch('style_format.xsl');

                if (!response.ok) {
                    throw new Error(
                        'Unable to load style_format.xsl. HTTP status: ' +
                        response.status
                    );
                }

                var xslContent = await response.text();

                // Parse XML and XSLT
                var parser = new DOMParser();

                var xmlDocument = parser.parseFromString(
                    xmlContent,
                    'application/xml'
                );

                var xslDocument = parser.parseFromString(
                    xslContent,
                    'application/xml'
                );

                // Check for XML parsing errors
                var xmlError = xmlDocument.querySelector('parsererror');

                if (xmlError) {
                    throw new Error(
                        'The selected XML file could not be parsed.'
                    );
                }

                var xslError = xslDocument.querySelector('parsererror');

                if (xslError) {
                    throw new Error(
                        'The XSLT file could not be parsed.'
                    );
                }

                /*
                 * Use the JavaScript XSLT processor.
                 *
                 * The library provides a browser-compatible
                 * XSLTProcessor implementation.
                 */
                var xsltProcessor =
                    new XsltProcessorLib.XSLTProcessor();

                xsltProcessor.importStylesheet(xslDocument);

                // Transform the XML using the XSLT
                var transformedContent =
                    xsltProcessor.transformToDocument(xmlDocument);

                // Display the transformed HTML
                var result = document.getElementById('result');

                result.innerHTML = '';

                if (transformedContent.documentElement) {

                    /*
                     * The existing XSLT generates a complete HTML
                     * document (<HTML><BODY>...</BODY></HTML>).
                     *
                     * We only need the contents of its BODY here.
                     */
                    var body =
                        transformedContent.getElementsByTagName('BODY')[0];

                    if (!body) {
                        body =
                            transformedContent.getElementsByTagName('body')[0];
                    }

                    if (body) {
                        result.innerHTML = body.innerHTML;
                    } else {
                        result.innerHTML =
                            new XMLSerializer()
                                .serializeToString(transformedContent);
                    }

                } else {
                    throw new Error(
                        'The XSLT transformation did not produce a result.'
                    );
                }

            } catch (error) {

                console.error(error);

                alert(
                    'Unable to process the XML file.\n\n' +
                    error.message
                );
            }
        }

        document
            .getElementById('readButton')
            .addEventListener('click', readXMLFile);
    </script>

</body>
</html>
